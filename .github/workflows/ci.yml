name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The real signers are the judges here: our .minisig must verify under
      # minisign, minisign's own signatures must verify under us, and cosign
      # must accept our blob signature. All three skipped on every push,
      # because nothing installed pkgx -- so the only thing ever checked about
      # a signature format was that this package agreed with itself.
      - name: pkgx, which brings the real signers
        run: curl -fsS https://pkgx.sh | sh
      # And the judges must be reachable in THIS lane: a skip here looks
      # exactly like a pass.
      - name: both judges are there
        run: |
          pkgx +jedisct1.github.io/minisign -- minisign -v
          pkgx +sigstore.dev/cosign -- cosign version
      - name: test + 100% coverage gate
        env:
          # A skip here would look exactly like a pass.
          SIGN_REQUIRE_PKGX: "1"
        run: |
          go test ./... -covermode=atomic -coverprofile=cov.out
          total=$(go tool cover -func=cov.out | awk '/^total:/{print $3}')
          echo "coverage: $total"
          [ "$total" = "100.0%" ] || { go tool cover -func=cov.out | awk '$3!="100.0%"'; exit 1; }
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable }
      - env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", CGO_ENABLED: "0" }
        run: go build ./...
